<!doctype html>
<meta charset="utf-8">
<title>Lugo talk probe</title>
<button id="go">Connect &amp; talk</button>
<button id="say">Send text</button>
<button id="stop">Stop</button>
<pre id="log"></pre>
<script type="module">
import { Conversation } from '/src/audio/conversation.ts'
import { login } from '/src/api/auth.ts'

const log = (m) => (document.getElementById('log').textContent += m + '\n')
window.__state = []
const conv = new Conversation({
  onState: (s) => { window.__state.push(s); log('state: ' + s) },
  onUserText: (t) => log('you: ' + t),
  onReplyText: (t) => log('lugo: ' + t),
  onError: (e) => log('ERROR: ' + e),
})
window.__conv = conv
document.getElementById('go').onclick = async () => {
  try {
    await login('e2e-user', 'pw12345678')
    log('login ok')
    await conv.connect()
  } catch (e) { log('ERROR login: ' + e) }
}
document.getElementById('stop').onclick = () => conv.disconnect()
document.getElementById('say').onclick = () => {
  log('sending text...')
  conv.sendText('Hello, how are you?')
}
</script>
